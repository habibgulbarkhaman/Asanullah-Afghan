
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ehsanullah_Afghan/android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: Ehsanullah_Afghan/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ehsanullah-Afghan-APK
          path: Ehsanullah_Afghan/android/app/build/outputs/apk/debug/app-debug.apk
